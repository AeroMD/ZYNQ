<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LMS Flowchart</title>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      font-family: sans-serif;
    }
    canvas {
      background: white;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    button {
      margin-top: 18px;
      padding: 10px 28px;
      font-size: 15px;
      background: #1565C0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0D47A1; }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<button onclick="saveImage()">Save as PNG</button>

<script>
// ── Canvas setup ─────────────────────────────────────────────────────────────
const W = 900, H = 1200;
const SCALE = 3;          // render at 3× → 2700×3600 px PNG (≈300 dpi on A4)
const canvas = document.getElementById('c');
canvas.width  = W * SCALE;
canvas.height = H * SCALE;
canvas.style.width  = W + 'px';   // display size unchanged
canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(SCALE, SCALE);          // all drawing coordinates stay the same

// ── Colours ──────────────────────────────────────────────────────────────────
const COL = {
  input:   { fill: '#BBDEFB', border: '#1565C0' },
  calc:    { fill: '#ECEFF1', border: '#78909C' },
  update:  { fill: '#FFE0B2', border: '#E65100' },
  output:  { fill: '#C8E6C9', border: '#2E7D32' },
  arrow:   '#546E7A',
  text:    '#212121',
  title:   '#212121',
};

// ── Rounded rectangle helper ──────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

// ── Draw a flowchart box ──────────────────────────────────────────────────────
function drawBox(cx, cy, bw, bh, lines, colKey) {
  const { fill, border } = COL[colKey];
  const x = cx - bw / 2;
  const y = cy - bh / 2;

  // shadow
  ctx.shadowColor = 'rgba(0,0,0,0.10)';
  ctx.shadowBlur  = 8;
  ctx.shadowOffsetY = 3;

  roundRect(x, y, bw, bh, 10);
  ctx.fillStyle = fill;
  ctx.fill();

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur  = 0;
  ctx.shadowOffsetY = 0;

  ctx.strokeStyle = border;
  ctx.lineWidth   = 2.5;
  roundRect(x, y, bw, bh);
  ctx.stroke();

  // text
  const lineH   = lines.length === 1 ? 0 : (lines.length === 2 ? 20 : 19);
  const startY  = cy - ((lines.length - 1) * lineH) / 2;

  lines.forEach((line, i) => {
    const isLabel = (i === 0 && lines.length > 1 &&
                     line.startsWith('STEP'));
    ctx.fillStyle  = COL.text;
    ctx.font       = isLabel
      ? 'bold 13px sans-serif'
      : (lines.length === 1 ? 'bold 14px sans-serif' : '13px sans-serif');
    ctx.textAlign  = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(line, cx, startY + i * lineH);
  });
}

// ── Draw a downward arrow ─────────────────────────────────────────────────────
function drawArrow(x, y1, y2) {
  const headLen = 12, headAngle = Math.PI / 7;
  ctx.strokeStyle = COL.arrow;
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(x, y1);
  ctx.lineTo(x, y2 - headLen);
  ctx.stroke();
  // arrowhead
  ctx.beginPath();
  ctx.moveTo(x, y2);
  ctx.lineTo(x - headLen * Math.sin(headAngle), y2 - headLen * Math.cos(headAngle));
  ctx.lineTo(x + headLen * Math.sin(headAngle), y2 - headLen * Math.cos(headAngle));
  ctx.closePath();
  ctx.fillStyle = COL.arrow;
  ctx.fill();
}

// ── Steps definition ──────────────────────────────────────────────────────────
const steps = [
  { lines: ['START — new sample pair arrives'],                          col: 'calc'   },
  { lines: ['STEP 1', 'Read  x(n)  from Rx "ref"  →  VP/VN'],          col: 'input'  },
  { lines: ['STEP 2', 'Read  d(n)  from Rx "observer"  →  VAUXP0'],    col: 'input'  },
  { lines: ['STEP 3  —  Shift delay line',
            'x_buf  =  [ x(n),  x(n-1),  …,  x(n-31) ]'],              col: 'calc'   },
  { lines: ['STEP 4  —  FIR filter output',
            'y(n)  =  Σ  w[i] × x_buf[i]   (i = 0 … 31)'],             col: 'calc'   },
  { lines: ['STEP 5  —  Compute error',
            'e(n)  =  d(n)  −  y(n)'],                                  col: 'calc'   },
  { lines: ['STEP 6  —  Update weights',
            'w[i]  =  w[i]  +  μ × e(n) × x_buf[i]',
            'μ  =  0.01   (learning rate)'],                             col: 'update' },
  { lines: ['STEP 7  —  Output results',
            'y(n)  →  Tx "feedback"  (anti-noise speaker)',
            'e(n)  →  ARM processor  (UART monitor)'],                   col: 'output' },
  { lines: ['WAIT for next sample pair',
            'then repeat from STEP 1'],                                  col: 'calc'   },
];

// ── Layout constants ──────────────────────────────────────────────────────────
const cx      = 420;     // centre x of boxes
const bw      = 560;     // box width
const bhShort = 62;      // height for 1–2 line boxes
const bhTall  = 90;      // height for 3-line boxes
const gap     = 30;      // vertical gap between boxes
const topY    = 100;     // y of first box centre

// ── Compute positions ─────────────────────────────────────────────────────────
const positions = [];
let y = topY;
steps.forEach(step => {
  const bh = step.lines.length >= 3 ? bhTall : bhShort;
  positions.push({ cx, cy: y, bw, bh });
  y += bh + gap;
});

// ── Draw title ────────────────────────────────────────────────────────────────
ctx.fillStyle    = COL.title;
ctx.font         = 'bold 18px sans-serif';
ctx.textAlign    = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('LMS Adaptive Filter — Algorithm Flowchart', W / 2, 38);

// ── Draw boxes ────────────────────────────────────────────────────────────────
positions.forEach((pos, i) => {
  drawBox(pos.cx, pos.cy, pos.bw, pos.bh, steps[i].lines, steps[i].col);
});

// ── Draw connecting arrows ────────────────────────────────────────────────────
for (let i = 0; i < positions.length - 1; i++) {
  const cur  = positions[i];
  const next = positions[i + 1];
  drawArrow(cx, cur.cy + cur.bh / 2, next.cy - next.bh / 2);
}

// ── Loop-back arrow ───────────────────────────────────────────────────────────
const last  = positions[positions.length - 1];
const step1 = positions[1];
const lx    = cx + bw / 2 + 50;   // right side of loop

ctx.strokeStyle = COL.arrow;
ctx.lineWidth   = 2;
ctx.setLineDash([6, 5]);

// stub right from last box
ctx.beginPath();
ctx.moveTo(cx + bw / 2, last.cy);
ctx.lineTo(lx, last.cy);
ctx.stroke();

// vertical line up
ctx.beginPath();
ctx.moveTo(lx, last.cy);
ctx.lineTo(lx, step1.cy);
ctx.stroke();

ctx.setLineDash([]);

// arrow left into step 1
const ax2 = lx, ay1 = step1.cy, ax1 = cx + bw / 2;
ctx.strokeStyle = COL.arrow;
ctx.lineWidth   = 2;
ctx.beginPath();
ctx.moveTo(ax2, ay1);
ctx.lineTo(ax1 + 14, ay1);
ctx.stroke();

// arrowhead pointing left
ctx.beginPath();
ctx.moveTo(ax1, ay1);
ctx.lineTo(ax1 + 14, ay1 - 7);
ctx.lineTo(ax1 + 14, ay1 + 7);
ctx.closePath();
ctx.fillStyle = COL.arrow;
ctx.fill();

// label
ctx.fillStyle    = '#424242';
ctx.font         = 'bold 12px sans-serif';
ctx.textAlign    = 'left';
ctx.textBaseline = 'middle';
ctx.fillText('repeat per sample', lx + 8, (last.cy + step1.cy) / 2);

// ── Legend ────────────────────────────────────────────────────────────────────
const legend = [
  { col: 'input',  label: 'ADC Input'     },
  { col: 'calc',   label: 'Computation'   },
  { col: 'update', label: 'Weight Update' },
  { col: 'output', label: 'Output'        },
];

const legendY  = H - 38;
const swSize   = 16;
const spacing  = 190;
const startX   = (W - spacing * (legend.length - 1) - swSize) / 2;

legend.forEach((item, i) => {
  const lx2 = startX + i * spacing;
  const { fill, border } = COL[item.col];

  roundRect(lx2, legendY - swSize / 2, swSize, swSize, 3);
  ctx.fillStyle   = fill;
  ctx.fill();
  ctx.strokeStyle = border;
  ctx.lineWidth   = 1.8;
  roundRect(lx2, legendY - swSize / 2, swSize, swSize, 3);
  ctx.stroke();

  ctx.fillStyle    = COL.text;
  ctx.font         = '13px sans-serif';
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(item.label, lx2 + swSize + 7, legendY);
});

// ── Save as PNG ───────────────────────────────────────────────────────────────
function saveImage() {
  const link  = document.createElement('a');
  link.download = 'lms_flowchart.png';
  link.href   = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
